services:
  database:
    image: postgres:17
    container_name: ctg_app_database
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: PhuThanh2004
      POSTGRES_DB: project_db

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ctg_app_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ctg-local-access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ctg-local-secret-change-me}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: ctg_app_minio_init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ctg-local-access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ctg-local-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-ctg-media}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set download "local/$${MINIO_BUCKET}"

volumes:
  postgres_data:
  minio_data:
